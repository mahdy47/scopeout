[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeout"
version = "0.1.0"
description = "Engagement-state engine for penetration testing - assets, services, leads, coverage."
requires-python = ">=3.10"

[project.scripts]
scopeout = "scopeout.cli:main"

[project.optional-dependencies]
# CLI-only development / test dependencies.
dev = ["pytest>=7.0", "httpx"]
# Dependencies for the read-only web/API layer (scopeout.web).
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Explicit package discovery: only `scopeout` is a Python package. The
# top-level `api/`, `examples/`, and `tests/` directories are NOT packages.
[tool.setuptools.packages.find]
include = ["scopeout*"]
